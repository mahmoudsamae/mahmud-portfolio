problem:
  de: >-
    Ein neuer Campingplatz an der Donau braucht seine erste Visitenkarte, hat
    aber noch nichts: keinen Namen, kein Logo, keine Farben.

    Die Gäste sind gemischt (Deutschland, Niederlande, international), und es
    kommen nicht nur Zelte, sondern auch Wohnmobile und Wohnwagen.
  en: >-
    A new campsite on the Danube needs its first business card, but has
    nothing to put on it yet: no name, no logo, no colours.

    Its guests are a mix of German, Dutch and international visitors, and they
    arrive with motorhomes and caravans as well as tents.
solution:
  de: >-
    Name: Ratis, von Ratisbona, dem lateinischen Namen Regensburgs. Kurz,
    international aussprechbar, mit lokaler Geschichte.

    Wortmarke: „RATIS“, das A als Zeltform mit leuchtender Tür. Bildmarke: Zelt
    und Wohnmobil auf einer gemeinsamen Linie, funktioniert bis 18 px.

    Visitenkarte: Vorderseite mit Foto und Logo, Rückseite mit Kontakt und
    QR-Code. Weniger Text, mehr Wirkung: Icons statt Beschriftungen, damit die
    Karte ohne Übersetzung funktioniert.

    QR-Landingpage: öffnet sich in DE, EN oder NL (automatisch nach
    Handysprache), mit vier klaren Aktionen: Bewerten, Platz anfragen, Route,
    E-Mail. Der QR-Code auf der Karte führt wirklich zur Demo-Seite.

    Druckdaten: PDF mit Beschnitt, 300 dpi+, Schrift im Sicherheitsabstand.
  en: >-
    Name: Ratis, after Ratisbona, the Latin name of Regensburg. Short, easy to
    say in any language, and rooted in local history.

    Wordmark: "RATIS", with the A drawn as a tent with a glowing door. Symbol:
    a tent and a motorhome on one shared line, still legible at 18 px.

    Business card: photo and logo on the front, contact details and a QR code
    on the back. Less text, more impact: icons instead of labels, so the card
    works without translation.

    QR landing page: opens in German, English or Dutch depending on the
    phone's language, with four clear actions: leave a review, request a
    pitch, get directions, send an email. The QR code on the card really opens
    the demo page.

    Print files: PDF with bleed, 300 dpi or more, all text inside the safe
    area.
process:
  de: >-
    Briefing: ein strukturiertes Gespräch mit 23 Fragen, von den Kontaktdaten
    bis zum Budget. Zwei Antworten haben das ganze Design bestimmt. Ziel der
    Karte sind mehr Google-Bewertungen und direkte Anfragen, deshalb ein
    QR-Code statt mehr Text. Die Zielgruppe sind Zelt und Wohnmobil, deshalb
    darf das Logo nicht nur „Zelt“ sagen. Wo der Kunde keine Antwort hatte
    (Name, Stil, Druck), habe ich konkrete Optionen zur Auswahl gestellt,
    statt offene Fragen zu wiederholen.

    Runde 1, Illustration: gezeichnete Donau-Szene. Feedback: zu verspielt,
    nicht professionell.

    Runde 2, geometrisch in zwei Richtungen: klare Flächen, Schwarz und
    Orange. Feedback: sauber, aber ohne Wirkung.

    Runde 3, Fotolook: cinematische Nachtaufnahme an der Donau
    (KI-generiert), Leuchteffekte in Orange. Der Durchbruch.

    Runde 4, Logo-Suche: Ein Brückenbogen wurde verworfen, dann sechs
    Bildmarken im Vergleich. Gewählt: Zelt & Wohnmobil in einer Linie, damit
    sich jeder Gast angesprochen fühlt.

    Gelernt: Wenn zwei Entwürfe hintereinander abgelehnt werden, liegt es
    selten am Entwurf, sondern am fehlenden gemeinsamen Bild. Referenzbilder
    vom Kunden haben das gelöst.

    Leuchten funktioniert auf dem Bildschirm, nicht auf Papier. Im Druck
    entsteht es durch Licht im Foto oder durch Veredelung (z. B. Spot-UV).

    Ein Logo ist kein Foto: Die Bildmarke bleibt einfach und vektoriell, die
    „echte“ Wirkung kommt aus Mockups und Bildwelt.
  en: >-
    Briefing: a structured conversation with 23 questions, from contact
    details to budget. Two answers shaped the whole design. The card's job is
    to bring in more Google reviews and direct enquiries, so it gets a QR code
    instead of more text. Guests come with tents and motorhomes, so the logo
    can't just say "tent". Where the client had no answer (name, style,
    printing), I offered concrete options to choose from instead of repeating
    open questions.

    Round 1, illustration: a hand-drawn Danube scene. Feedback: too playful,
    not professional enough.

    Round 2, geometric, in two directions: clean shapes in black and orange.
    Feedback: tidy, but flat.

    Round 3, photo look: a cinematic night shot on the Danube (AI-generated)
    with orange glow effects. This was the breakthrough.

    Round 4, the logo: a bridge-arch idea was dropped, then six symbols were
    compared side by side. The pick: a tent and a motorhome on one line, so
    every guest feels addressed.

    What I learned: when two drafts in a row are rejected, the drafts are
    rarely the problem; the shared picture of the goal is missing. Reference
    images from the client fixed that.

    Glow works on screen, not on paper. In print it has to come from light in
    the photo or from a finish such as spot UV.

    A logo is not a photo: the symbol stays simple and vector-based, and the
    "real" atmosphere comes from mockups and imagery.
note:
  de: >-
    Ratis Camping ist ein fiktives Konzeptprojekt, kein echter Betrieb. Fotos
    und Bildwelt sind KI-generiert. Adresse, Telefonnummer und Domain sind
    Platzhalter.
  en: >-
    Ratis Camping is a fictional concept project, not a real business. The
    photos and imagery are AI-generated. The address, phone number and domain
    are placeholders.
