summary:
  de: >-
    Name, Logo, druckfertige Visitenkarte und eine dreisprachige
    QR-Landingpage für einen fiktiven Campingplatz an der Donau. Live
    ausprobieren: die Seite, auf die der QR-Code der Karte führt.
  en: >-
    Name, logo, a print-ready business card and a three-language QR landing
    page for a fictional campsite on the Danube. Try it live: the page the
    card's QR code opens.
