title:
  de: ÜBER MICH
  en: ABOUT ME
text:
  de: |-
    Seit März 2026 arbeite ich an der Rezeption von AZUR Camping in Regensburg. Aus eigener Initiative, ermutigt von meinem Vorgesetzten, habe ich dort zwei Systeme gebaut, die heute täglich an der Rezeption im Einsatz sind: die Frühstücksbestellung für Gäste und die Smart-Feedback-Plattform.

    Für beide bin ich von Anfang bis Ende verantwortlich: Entwicklung, Betrieb und sogar die Hosting-Kosten, die ich selbst bezahlt habe. Das Bestellsystem läuft heute an einem Standort; die Einführung an weiteren Standorten ist geplant.

    Programmieren ist meine Leidenschaft. Nach der Arbeit verbringe ich täglich mehr als 8 Stunden damit, Software zu bauen und mit KI zu arbeiten. Studiert habe ich es auch.
  en: |-
    Since March 2026 I have worked at the reception of AZUR Camping in Regensburg. On my own initiative, encouraged by my manager, I built two systems there that are now in daily use at the reception: the guest breakfast ordering system and the Smart Feedback platform.

    I am responsible for both end to end: development, operation and even the hosting costs, which I paid myself. The ordering system runs at one location today; a rollout to further locations is planned.

    Programming is my passion. After work I spend more than 8 hours a day building software and working with AI. I also studied it.
